version: "2"

run:
  build-tags: [integration, e2e]

linters:
  default: standard            # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - forbidigo
    - gosec
    - misspell
  settings:
    forbidigo:
      forbid:
        - pattern: EmergencyContainer
          msg: inject the dependency with `container:"inject"` instead of a service locator
    gosec:
      excludes: [G104]         # unhandled errors are errcheck's job
  exclusions:
    # strict: skip only files whose header matches the Go convention
    # (^// Code generated .* DO NOT EDIT\.$), not looser "autogenerated" markers.
    # A hand-written file with that header is skipped too, which is why AGENTS.md
    # forbids adding one.
    generated: strict
    # Generator output is checked by regenerating, not by linting. An app that has
    # stopped regenerating deletes this entry: its generated/ code is hand-maintained.
    paths:
      - ".*/generated/.*"
    rules:
      # A deferred Close has nowhere useful to report its error.
      - linters: [errcheck]
        source: '^\s*defer .*\.Close\('
      # Tests read fixture paths and talk to the stack they started.
      - linters: [gosec]
        path: '(_test\.go$|^test/)'

formatters:
  enable: [gofmt, goimports]
