# The framework had no CI at all before this. There was no .github/workflows directory, so
# nothing ran `go vet`, nothing ran the race detector, nothing started a database, and nothing
# would ever have noticed a new advisory against a dependency — every one of the release exit
# criteria was a thing somebody had to remember to type.
name: CI

on:
  push:
    branches: [main, develop, 'release/**', 'security-review*']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: build, vet, test, race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Read from go.mod so the toolchain directive is the single source of truth, and so
          # TestTheE2eImageAndGoModPinTheSameToolchain keeps the e2e image in step with it.
          go-version-file: go.mod
          check-latest: true
          cache: true

      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      # Separate step, not -race on the run above: a race failure and a logic failure are
      # different problems and the log should say which one happened.
      - run: go test -race ./...

  live-db:
    name: live PostgreSQL, MySQL and SQL Server
    runs-on: ubuntu-latest

    # Ports and credentials are the ones the live tests use: e2e/tests/live_db_test.go
    # defaults to them, and testsupport/live_test.go hardcodes them with no override, so
    # these services must publish exactly 5433 and 3307 as postgres/test and root/test, and
    # 14330 as sa/Gorgany-Test-1. SQL Server refuses a password below its complexity policy,
    # so it cannot share the others' "test".
    #
    # Service containers cannot take a command, so MySQL runs without the compose file's
    # --character-set-server flags. mysql:8 already defaults to utf8mb4, and the datasource
    # sets utf8mb4_unicode_ci on every connection it opens. Nor can the SQL Server image
    # create a database from its environment, so the SQL Server cases create gorgany_test
    # through master themselves.
    #
    # The SQL Server image is the one e2e/docker-compose.yml pins, a cumulative update rather
    # than 2022-latest, so a new CU reaches these cases only in a commit that says so.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: gorgany_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d gorgany_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: gorgany_test
        ports: ['3307:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -ptest --silent"
          --health-interval 5s --health-timeout 5s --health-retries 30
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: Gorgany-Test-1
          MSSQL_PID: Developer
        ports: ['14330:1433']
        # -C trusts the server's self-signed certificate, which tools18 otherwise refuses.
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Gorgany-Test-1 -C -l 5 -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 5s --health-timeout 10s --health-retries 30 --health-start-period 60s

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      # E2E_REQUIRE_LIVE turns the per-engine skips fatal. Without it `go test` reports an
      # all-skipped run as `ok`, which is how twelve live cases came to be skipped while the
      # criterion they were supposed to satisfy read as passed. It covers Postgres and MySQL;
      # E2E_REQUIRE_SQLSERVER does the same for the SQL Server cases, which skip elsewhere
      # because SQL Server is often not there (see requireSQLServerEnvVar in e2e_test.go).
      #
      # e2e_test.go's cases need the fixture app, which only the e2e job starts, so under
      # E2E_REQUIRE_LIVE they would fail here. They are exactly the cases that compile
      # without the livedb tag, so they are listed that way and skipped. The listing clears
      # both switches, since each also fails a run in which no case of its engine executed,
      # and a listing executes none. pipefail keeps a failing `go test` from being reported
      # as tee's success.
      - name: run the live suites
        env:
          E2E_REQUIRE_LIVE: '1'
          E2E_REQUIRE_SQLSERVER: '1'
          E2E_PG_HOST: 127.0.0.1
          E2E_PG_PORT: '5433'
          E2E_MYSQL_HOST: 127.0.0.1
          E2E_MYSQL_PORT: '3307'
          E2E_MSSQL_HOST: 127.0.0.1
          E2E_MSSQL_PORT: '14330'
        run: |
          set -o pipefail
          fixture_cases=$(E2E_REQUIRE_LIVE='' E2E_REQUIRE_SQLSERVER='' go test -list . ./e2e/tests | grep '^Test' | paste -sd '|' -)
          go test -tags=livedb ./e2e/tests -count=1 -v -skip "^(${fixture_cases})\$" 2>&1 | tee live-db.log

      # Independent proof the suites ran, rather than a green tick over an all-skip run.
      #
      # Each engine names the cases whose PASS lines prove it ran, and every one must be in
      # the log. This used to grep for the engine's name, which any line satisfied: a case
      # named for the engine matched whether it passed or not, and the ORM cases drop MySQL
      # with only a log line when it is unreachable. An engine with no case named proves
      # nothing, so that fails too.
      - name: assert every engine actually executed
        run: |
          set -euo pipefail
          pinned_cases() {
            case "$1" in
              postgres)
                echo TestA1_OrmCreateInsertsOnEveryEngine/postgres
                echo TestT15_SessionsMigrationOnPostgres
                ;;
              mysql)
                echo TestA1_OrmCreateInsertsOnEveryEngine/mysql
                echo TestT15_SessionsMigrationOnMySQL
                echo TestMySQLQueriesRoundTripThroughTheDialect
                ;;
              sqlserver)
                echo TestA1_OrmCreateInsertsOnEveryEngine/sqlserver
                echo TestSQLServerConnectsWithSQLLogin
                echo TestSQLServerQueriesRoundTripThroughTheDialect
                echo TestExternalSchemaRefusesMigrateSeedAndDiffOnSQLServer
                ;;
            esac
          }
          for engine in postgres mysql sqlserver; do
            cases=$(pinned_cases "$engine")
            if [ -z "$cases" ]; then
              echo "::error::no case is pinned for $engine, so nothing here proves its suite ran"
              exit 1
            fi
            for case in $cases; do
              if ! grep -qF -- "--- PASS: $case " live-db.log; then
                echo "::error::$case did not pass, so the $engine suite did not run"
                exit 1
              fi
            done
          done

      # testsupport has no E2E_REQUIRE_LIVE: an unreachable engine skips its subtest and the
      # run still exits 0. So both engines must show a pass, and the only skip allowed is
      # the case that points at a closed port on purpose. SQL Server is not in the loop: the
      # harness cannot truncate it yet (see truncate in testsupport/database.go), so its live
      # suite has no SQL Server subtest to pass.
      - name: run the testsupport live suite
        run: |
          set -o pipefail
          go test -tags=livedb ./testsupport/ -count=1 -v 2>&1 | tee testsupport-live.log
          for engine in postgres mysql; do
            if ! grep -q -- "--- PASS: TestTheHarnessMigratesAndConnects/$engine " testsupport-live.log; then
              echo "::error::testsupport never ran against $engine"
              exit 1
            fi
          done
          if grep -- '--- SKIP' testsupport-live.log | grep -v 'TestAnUnreachableEngineSkipsRatherThanHangs/'; then
            echo "::error::a testsupport live case skipped, so an engine was not reached"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-db-log
          path: |
            live-db.log
            testsupport-live.log

  # run.sh builds e2e/Dockerfile for every service, so this still proves the image builds
  # on the pinned toolchain; it then runs the fixture and live suites in the compose network
  # under E2E_REQUIRE_LIVE, and dumps container logs when it fails.
  e2e:
    name: dockerised e2e harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh e2e/run.sh
