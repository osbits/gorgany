# The framework had no CI at all before this. There was no .github/workflows directory, so
# nothing ran `go vet`, nothing ran the race detector, nothing started a database, and nothing
# would ever have noticed a new advisory against a dependency — every one of the release exit
# criteria was a thing somebody had to remember to type.
name: CI

on:
  push:
    branches: [main, develop, 'release/**', 'security-review*']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: build, vet, test, race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Read from go.mod so the toolchain directive is the single source of truth, and so
          # TestTheE2eImageAndGoModPinTheSameToolchain keeps the e2e image in step with it.
          go-version-file: go.mod
          check-latest: true
          cache: true

      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      # Separate step, not -race on the run above: a race failure and a logic failure are
      # different problems and the log should say which one happened.
      - run: go test -race ./...

  live-db:
    name: live PostgreSQL and MySQL
    runs-on: ubuntu-latest

    # Ports and credentials are the ones the live tests use: e2e/tests/live_db_test.go
    # defaults to them, and testsupport/live_test.go hardcodes them with no override, so
    # these services must publish exactly 5433 and 3307 as postgres/test and root/test.
    #
    # Service containers cannot take a command, so MySQL runs without the compose file's
    # --character-set-server flags. mysql:8 already defaults to utf8mb4, and the datasource
    # sets utf8mb4_unicode_ci on every connection it opens.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: gorgany_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d gorgany_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: gorgany_test
        ports: ['3307:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -ptest --silent"
          --health-interval 5s --health-timeout 5s --health-retries 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      # E2E_REQUIRE_LIVE turns the per-engine skips fatal. Without it `go test` reports an
      # all-skipped run as `ok`, which is how twelve live cases came to be skipped while the
      # criterion they were supposed to satisfy read as passed.
      #
      # e2e_test.go's cases need the fixture app, which only the e2e job starts, so under
      # E2E_REQUIRE_LIVE they would fail here. They are exactly the cases that compile
      # without the livedb tag, so they are listed that way and skipped. pipefail keeps a
      # failing `go test` from being reported as tee's success.
      - name: run the live suites
        env:
          E2E_REQUIRE_LIVE: '1'
          E2E_PG_HOST: 127.0.0.1
          E2E_PG_PORT: '5433'
          E2E_MYSQL_HOST: 127.0.0.1
          E2E_MYSQL_PORT: '3307'
        run: |
          set -o pipefail
          fixture_cases=$(E2E_REQUIRE_LIVE='' go test -list . ./e2e/tests | grep '^Test' | paste -sd '|' -)
          go test -tags=livedb ./e2e/tests -count=1 -v -skip "^(${fixture_cases})\$" 2>&1 | tee live-db.log

      # Independent proof the suites ran, rather than a green tick over an all-skip run.
      - name: assert both engines actually executed
        run: |
          set -euo pipefail
          grep -q -- '--- PASS' live-db.log
          for engine in postgres mysql; do
            if ! grep -qi "$engine" live-db.log; then
              echo "::error::the live log never mentions $engine; that suite did not run"
              exit 1
            fi
          done

      # testsupport has no E2E_REQUIRE_LIVE: an unreachable engine skips its subtest and the
      # run still exits 0. So both engines must show a pass, and the only skip allowed is
      # the case that points at a closed port on purpose.
      - name: run the testsupport live suite
        run: |
          set -o pipefail
          go test -tags=livedb ./testsupport/ -count=1 -v 2>&1 | tee testsupport-live.log
          for engine in postgres mysql; do
            if ! grep -q -- "--- PASS: TestTheHarnessMigratesAndConnects/$engine " testsupport-live.log; then
              echo "::error::testsupport never ran against $engine"
              exit 1
            fi
          done
          if grep -- '--- SKIP' testsupport-live.log | grep -v 'TestAnUnreachableEngineSkipsRatherThanHangs/'; then
            echo "::error::a testsupport live case skipped, so an engine was not reached"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-db-log
          path: |
            live-db.log
            testsupport-live.log

  # run.sh builds e2e/Dockerfile for every service, so this still proves the image builds
  # on the pinned toolchain; it then runs the fixture and live suites in the compose network
  # under E2E_REQUIRE_LIVE, and dumps container logs when it fails.
  e2e:
    name: dockerised e2e harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh e2e/run.sh
